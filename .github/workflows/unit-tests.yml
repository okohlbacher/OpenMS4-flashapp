name: App contracts and published wheel
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==9.1.1 fakeredis==2.38.0 psutil==7.0.0 rq==2.12.0 redis==8.1.0
      - name: Verify artifacts, command lifecycle, queue state and log outcomes
        run: python -m pytest tests/test_artifacts.py tests/test_execution_lifecycle.py tests/test_queue_manager_cancel.py tests/test_log_status.py tests/test_deployment_contract.py -v
      # Full UI/scientific tests require verified native artifacts and run separately.
  ordinary-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned app dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install pytest==9.1.1 fakeredis==2.38.0
      - name: Select the released pyOpenMS wheel
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path('experimental/pyopenms-linux-x64.lock.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"WHEEL={lock['artifacts'][0]['path']}\n")
              output.write(f"WHEEL_RELEASE={lock['release']}\n")
          PY
      - name: Download and verify the pinned split wheel
        run: |
          mkdir wheel-artifacts
          curl --fail --location --retry 3 --output "wheel-artifacts/$WHEEL" \
            "https://github.com/okohlbacher/OpenMS4-pyopenms/releases/download/$WHEEL_RELEASE/$WHEEL"
          python experimental/verify_artifacts.py experimental/pyopenms-linux-x64.lock.json wheel-artifacts --wheel-only --check-host
      - name: Install verified wheel
        run: |
          python -m pip install --no-deps "wheel-artifacts/$WHEEL"
          python -m pip check
      - name: Exercise app tests against the published pyOpenMS wheel
        run: python -m pytest tests -v
