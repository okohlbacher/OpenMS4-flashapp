name: Isolated app contract tests
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==9.1.1 fakeredis==2.38.0 psutil==7.0.0 rq==2.12.0 redis==8.1.0
      - name: Verify artifacts, command lifecycle, queue state and log outcomes
        run: python -m pytest tests/test_artifacts.py tests/test_execution_lifecycle.py tests/test_queue_manager_cancel.py tests/test_log_status.py tests/test_deployment_contract.py -v
      # Full UI/scientific tests require verified native artifacts and run separately.
  ordinary-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-pinned app dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install pytest==9.1.1
          python -m pip check
      - name: Exercise data exchange and existing viewer data helpers
        run: python -m pytest tests/test_dependency_smoke.py tests/test_manual_upload.py tests/test_render_compression.py tests/test_selection_clear.py tests/test_legal_links.py -v
