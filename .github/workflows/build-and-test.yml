name: Artifact validation (manual migration gate)
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID containing flashapp-artifacts (artifacts.lock.json plus artifacts/)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flashapp-artifacts
          path: artifact-inputs
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact app artifact contract
        run: python experimental/verify_artifacts.py artifact-inputs/artifacts.lock.json artifact-inputs/artifacts
      # This gate does not publish an image or claim scientific/live-RQ acceptance.
