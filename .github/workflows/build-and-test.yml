name: Artifact validation (manual migration gate)
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID containing flashapp-artifacts (artifacts.lock.json plus artifacts/)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: flashapp-artifacts
          path: artifact-inputs
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact app artifact contract
        run: python experimental/verify_artifacts.py artifact-inputs/artifacts.lock.json artifact-inputs/artifacts
      # This gate does not publish an image or claim scientific/live-RQ acceptance.
