# Local execution. Online deployments also need a separately managed Redis and
# RQ worker sharing /workspaces and the identical image; see experimental/README.md.
services:
  flashapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set an immutable Python 3.12 image with a sha256 digest}
    image: openms4-flashapp:experimental
    ports:
      - "8501:8501"
    volumes:
      - flashapp-workspaces:/workspaces
      # Optional input data: set local_data_dir in your mounted settings.json.
      # - /path/to/data:/mounted-data:ro
volumes:
  flashapp-workspaces:
